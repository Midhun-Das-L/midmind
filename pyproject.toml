[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "midmind"
version = "0.2.0"
authors = [
  { name="Midhun", email="midhun.das.l.25@gmail.com" }
]
description = "Build grounded, cited RAG prompts from your documents in one line. Zero dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

keywords = ["AI", "prompt", "prompt engineering", "LLM", "RAG", "retrieval", "BM25", "embeddings", "semantic search", "hybrid search", "toolkit"]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.2", "numpy"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Midhun-Das-L/midmind"
Issues = "https://github.com/Midhun-Das-L/midmind/issues"

[tool.setuptools]
packages = ["midmind"]
